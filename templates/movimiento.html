<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registro Movimiento</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background-color:#f3f4f6;height:100vh;display:flex;align-items:center;justify-content:center}.card{width:100%;max-width:500px;box-shadow:0 4px 16px rgba(0,0,0,0.1);border-radius:1rem}</style></head><body><div class="card p-4"><h4 class="text-center mb-3">Registrar Movimiento</h4><form action="/movimiento" method="post"><div class="mb-3"><label class="form-label">Usuario</label><input type="text" name="usuario" class="form-control" required></div><div class="mb-3"><label class="form-label">Tipo</label><select name="tipo" class="form-select" required><option value="ingreso">Ingreso</option><option value="egreso">Egreso</option></select></div><div class="mb-3"><label class="form-label">Categoría</label><input type="text" name="categoria" class="form-control" required></div><div class="mb-3"><label class="form-label">Monto</label><input type="number" name="monto" step="0.01" class="form-control" required></div><div class="mb-3"><label class="form-label">Fecha</label><input type="date" name="fecha" class="form-control" required></div><div class="mb-3"><label class="form-label">Descripción</label><input type="text" name="descripcion" class="form-control" required></div><div class="d-grid"><button class="btn btn-success">Guardar Movimiento</button></div></form><p class="mt-3 text-center"><a href="/">Volver al inicio</a></p></div></body></html>
