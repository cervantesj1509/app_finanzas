<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
    <div class="container">
        <h2>Login</h2>
        <form action="/login" method="post">
            <input class="form-control mb-2" type="text" name="usuario" placeholder="Usuario" required>
            <input class="form-control mb-2" type="password" name="clave" placeholder="Contraseña" required>
            <button class="btn btn-primary" type="submit">Iniciar sesión</button>
        </form>
        <p class="mt-2">¿No tienes cuenta? <a href="/registro">Regístrate</a></p>
    </div>
</body>
</html>
