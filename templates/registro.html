<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registro</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background-color:#f3f4f6;height:100vh;display:flex;align-items:center;justify-content:center}.card{width:100%;max-width:400px;box-shadow:0 4px 16px rgba(0,0,0,0.1);border-radius:1rem}</style></head><body><div class="card p-4"><h4 class="text-center mb-3">Crear cuenta</h4><form action="/registro" method="post"><div class="mb-3"><label class="form-label">Usuario</label><input type="text" name="usuario" class="form-control" required></div><div class="mb-3"><label class="form-label">Contraseña</label><input type="password" name="clave" class="form-control" required></div><div class="d-grid"><button class="btn btn-success">Registrarse</button></div></form><p class="mt-3 text-center"><a href="/">Volver al inicio</a></p></div></body></html>
